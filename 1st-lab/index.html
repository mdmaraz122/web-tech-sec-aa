    <h1>My name is <b style="color: brown;">Md. Maraz</b></h1>

    <div>
        <form>
            <label for="name">Name:</label> <br>
            <input type="text" id="name" name="name" placeholder="Name"><br><br>

            <label for="email">Email:</label> <br>
            <input type="email" id="email" name="email" placeholder="Email"><br><br>

            <label for="phone">Phone:</label> <br>
            <input type="number" id="phone" name="phone" placeholder="Phone"><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="bangladesh">Bangladesh</option>
                <option value="india">India</option>
                <option value="pakistan">Pakistan</option>
                <option value="nepal">Nepal</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message here..."></textarea><br><br>
            <input type="submit" value="Submit">
        </form>
    </div>
